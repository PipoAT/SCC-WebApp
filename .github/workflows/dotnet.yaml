# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: .NET

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x
    - name: Restore dependencies
      run: dotnet restore SCC-WebApp.sln
    - name: Build
      run: dotnet build SCC-WebApp.sln --no-restore
    - name: Check for test projects
      id: check-tests
      run: |
        if dotnet sln SCC-WebApp.sln list | grep -i test; then
          echo "has_tests=true" >> $GITHUB_OUTPUT
        else
          echo "has_tests=false" >> $GITHUB_OUTPUT
        fi
    - name: Test
      if: steps.check-tests.outputs.has_tests == 'true'
      run: dotnet test SCC-WebApp.sln --no-build --verbosity normal